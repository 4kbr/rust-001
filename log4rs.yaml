appenders:
  stdout:
    kind: console
  app_file:
    kind: rolling_file
    path: "logs/test.log"
    policy:
      kind: compound
      trigger:
        kind: size
        limit: 1mb
      roller:
        kind: fixed_window
        base: 1
        count: 5
        pattern: "logs/test.{}.log"

root:
  level: trace
  appenders:
    - stdout
    - app_file
